<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow ledger · gsheet form</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 780px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.15);
            padding: 2rem 1.8rem;
            transition: all 0.2s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .title-section h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0f2b3d, #1e4b6e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .refresh-btn {
            background: #eef2f6;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            color: #17596b;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1.5px solid #dde7f0;
        }
        .refresh-btn:hover {
            background: #dde7f0;
            transform: scale(1.02);
        }
        .refresh-btn i {
            font-size: 0.9rem;
        }
        .subhead {
            color: #3a546d;
            font-weight: 400;
            font-size: 0.95rem;
            border-left: 3px solid #2b7a8a;
            padding-left: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .row-duo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e3b4f;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        label i {
            color: #2b7a8a;
            font-size: 0.8rem;
            width: 1.2rem;
        }
        input, select, textarea {
            background: #f8fafd;
            border: 1.5px solid #dde7f0;
            border-radius: 18px;
            padding: 0.75rem 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.15s;
            outline: none;
            color: #0b2a3b;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #2b7a8a;
            background: white;
            box-shadow: 0 0 0 4px rgba(43,122,138,0.15);
        }
        input[readonly] {
            background: #e9edf2;
            color: #1e3f58;
            font-weight: 500;
            cursor: default;
            border-color: #cbd6e3;
        }

        /* ----- User Selector Pill ----- */
        .user-selector-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .user-pill-group {
            display: flex;
            gap: 0.75rem;
        }
        .user-pill {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.2rem;
            border-radius: 18px;
            border: 1.5px solid #dde7f0;
            background: #f8fafd;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 500;
            color: #3a546d;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
        }
        .user-pill:hover {
            border-color: #2b7a8a;
            background: #eef6f8;
        }
        .user-pill.active-alfari {
            background: linear-gradient(135deg, #1a5e72, #2b7a8a);
            border-color: #1a5e72;
            color: white;
            box-shadow: 0 4px 14px -4px rgba(27,94,114,0.45);
        }
        .user-pill.active-nenis {
            background: linear-gradient(135deg, #7c3d6e, #a855a0);
            border-color: #7c3d6e;
            color: white;
            box-shadow: 0 4px 14px -4px rgba(124,61,110,0.45);
        }
        .user-pill .pill-avatar {
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255,255,255,0.25);
            flex-shrink: 0;
        }
        .user-pill:not(.active-alfari):not(.active-nenis) .pill-avatar {
            background: #dde7f0;
            color: #3a546d;
        }
        .user-badge {
            font-size: 0.78rem;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            margin-left: auto;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .user-pill.active-alfari .user-badge,
        .user-pill.active-nenis .user-badge {
            opacity: 1;
            background: rgba(255,255,255,0.22);
        }
        #userWarning {
            color: #b13e3e;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
        /* ----- end User Selector ----- */

        .search-dropdown {
            position: relative;
        }
        .search-input {
            width: 100%;
            background: #f8fafd;
            border: 1.5px solid #dde7f0;
            border-radius: 18px;
            padding: 0.75rem 1.2rem;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-input span {
            color: #2c5770;
        }
        .search-input i {
            color: #7c9bb0;
            transition: 0.2s;
        }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px -8px rgba(0,40,60,0.25);
            border: 1px solid #cde0ec;
            max-height: 280px;
            overflow-y: auto;
            z-index: 30;
            display: none;
            padding: 0.5rem 0;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-searchbox {
            padding: 0.6rem 1rem;
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid #d2e1ed;
        }
        .dropdown-searchbox input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 1px solid #bed6e8;
            background: #f3f8ff;
            font-size: 0.9rem;
        }
        .dropdown-items {
            padding: 0.2rem 0;
        }
        .dropdown-item {
            padding: 0.65rem 1.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            color: #153e54;
            transition: background 0.1s;
        }
        .dropdown-item:hover {
            background: #dff2f5;
        }
        .dropdown-item.selected {
            background: #c2e2eb;
            font-weight: 500;
            color: #0b394b;
        }
        .meta-note {
            font-size: 0.8rem;
            color: #4b6376;
            margin-top: 0.25rem;
            margin-left: 0.5rem;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .nominal-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .nominal-prefix {
            position: absolute;
            left: 1.2rem;
            color: #64748b;
            font-weight: 500;
            pointer-events: none;
        }
        #nominal {
            padding-left: 2.5rem;
            text-align: right;
            font-weight: 500;
        }
        .btn-submit {
            background: #17596b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 1rem 1.8rem;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 18px -6px #1c6e8570;
            margin-top: 1rem;
            width: 100%;
        }
        .btn-submit:hover {
            background: #0f4859;
            transform: scale(1.01);
            box-shadow: 0 10px 22px -6px #145b70;
        }
        .btn-submit:active {
            background: #08323f;
        }
        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .info-message {
            background: #e5f2f5;
            border-radius: 40px;
            padding: 0.7rem 1.5rem;
            font-size: 0.9rem;
            color: #165f71;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-top: 1rem;
        }
        .info-message i {
            font-size: 1.2rem;
        }
        .hidden {
            display: none;
        }
        .warning-text {
            color: #b13e3e;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
        @media (max-width: 540px) {
            .card { padding: 1.5rem 1.2rem; }
            .row-duo { grid-template-columns: 1fr; gap: 1rem; }
            .user-pill-group { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header-row">
        <div class="title-section">
            <h1>📒 flow ledger</h1>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh page">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
    <div class="subhead">submit entry · direct to google sheets</div>

    <form id="ledgerForm" class="form-grid">

        <!-- ===== USER SELECTOR ===== -->
        <div class="user-selector-field">
            <label><i class="fas fa-user"></i> Untuk siapa?</label>
            <div class="user-pill-group">
                <div class="user-pill" id="pillAlfari" data-user="Alfari">
                    <div class="pill-avatar">AF</div>
                    <span>Alfari</span>
                    <span class="user-badge">✓ aktif</span>
                </div>
                <div class="user-pill" id="pillNenis" data-user="Nenis">
                    <div class="pill-avatar">NN</div>
                    <span>Nenis</span>
                    <span class="user-badge">✓ aktif</span>
                </div>
            </div>
            <div id="userWarning" class="hidden">⚠️ Pilih user terlebih dahulu.</div>
        </div>
        <!-- ===== END USER SELECTOR ===== -->

        <!-- row: date & time -->
        <div class="row-duo">
            <div class="field">
                <label><i class="far fa-calendar-alt"></i> Date</label>
                <input type="date" id="dateInput" name="date" required>
            </div>
            <div class="field">
                <label><i class="far fa-clock"></i> Time (24h)</label>
                <input type="time" id="timeInput" name="time" step="60" required>
            </div>
        </div>

        <!-- Income/Outcome dropdown -->
        <div class="field">
            <label><i class="fas fa-arrow-up"></i> Income / Outcome</label>
            <select id="incomeOutcome" name="incomeOutcome" required>
                <option value="" disabled selected>– select type –</option>
                <option value="Pemasukan">💰 Income (Pemasukan)</option>
                <option value="Pengeluaran">💸 Outcome (Pengeluaran)</option>
            </select>
        </div>

        <!-- Sub category with search -->
        <div class="field">
            <label><i class="fas fa-tag"></i> Sub category <span style="font-weight:normal; margin-left: 8px;">(search & select)</span></label>
            <div class="search-dropdown" id="subCategoryDropdown">
                <div class="search-input" id="dropdownToggle">
                    <span id="selectedSubLabel">First select Income/Outcome</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="dropdown-searchbox">
                        <input type="text" id="subSearch" placeholder="type to filter..." autocomplete="off">
                    </div>
                    <div class="dropdown-items" id="dropdownItemsContainer"></div>
                </div>
            </div>
            <input type="hidden" id="subCategory" name="subCategory" required>
            <div id="categoryWarning" class="warning-text hidden"></div>
        </div>

        <!-- Main category (auto) -->
        <div class="field">
            <label><i class="fas fa-layer-group"></i> Main category</label>
            <input type="text" id="mainCategory" name="mainCategory" readonly placeholder="auto filled">
        </div>

        <!-- Nominal -->
        <div class="field">
            <label><i class="fas fa-coins"></i> Nominal (IDR)</label>
            <div class="nominal-wrapper">
                <span class="nominal-prefix">Rp</span>
                <input type="text" id="nominal" name="nominal" placeholder="0" required autocomplete="off">
            </div>
            <div class="meta-note">* Format otomatis: 1.000.000 (nilai asli: 1000000)</div>
        </div>

        <!-- Desc -->
        <div class="field">
            <label><i class="fas fa-pencil-alt"></i> Description</label>
            <textarea id="desc" name="desc" placeholder="e.g. lunch at warteg..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Send to gsheet
        </button>
    </form>

    <div class="info-message" id="liveInfo">
        <i class="fas fa-info-circle"></i>
        <span id="infoText">Pilih user, lalu isi form dan kirim.</span>
    </div>
</div>

<script>
    (function() {
        const GSHEET_URL       = 'https://script.google.com/macros/s/AKfycbwowRcjbkBUkby-akpYl4qFEyBKHdEcbe78hIyo4v269bSwWIdIoXecI1O-uaxpiKG6Gw/exec';
        const GSHEET_URL_NENIS = 'https://script.google.com/macros/s/AKfycbysyqF24Ydd-Vj57QCwpUkOrCKUdWLg_F95RuiuR8lc-fO0-sq3e1WS91GTAa8HVrQWOw/exec';

        // ----- MAPPING DATA -----
        const mapping = {
            outcome: [
                { main: "HOUSING & UTILITAS", subs: ["Mortgage or Rent","Maintenance or Repairs","Electricity","Water and Sewer","Gas","Waste Removal","Household Supplies","Other Housing"] },
                { main: "TRANSPORTATION", subs: ["Fuel","Bus/Taxi Fare","Toll","Parking","Vehicle Maintenance","Other Transport"] },
                { main: "FOOD & GROCERIES", subs: ["Groceries","Dining Out","Jajan/Snack","Other Food"] },
                { main: "PERSONAL CARE & HEALTH", subs: ["Medical","Hair/Nails/Spa","Skin and Body Care","Clothing","Service HP","Other Personal Care"] },
                { main: "FIXED BILLS & INSURANCE", subs: ["Internet (Home)","Mobile Phone Bill/Pulsa","Cable (TV Berlangganan)","Health Insurance","Life Insurance","Home Insurance","Organization Dues or Fees","Taxes (Admin Fee/Bank)","Other Bills"] },
                { main: "ENTERTAINMENT & HOBBIES", subs: ["Games","Streaming (Youtube, Netflix, dll.)","Movies/Concert/Events","Dating/Social","Electronic","Shopping (Non-Clothing)","Other Entertainment"] },
                { main: "EDUCATION & SELF-IMPROVEMENT", subs: ["Online Course","Book/Ebook","FC & Print","Other Education"] },
                { main: "GIFTS, PETS & MISC.", subs: ["Family/Adek/My Beb","Donation & Gift","Pet Food & Supplies","Pet Medical/Grooming","Miscellaneous/Buffer"] },
                { main: "LOANS & DEBTS", subs: ["Personal Loan","Student Loan","Credit Card Payment","Phone Payment","Friend (Repayment)","Other Loans & Debt"] }
            ],
            income: [
                { main: "SAVINGS & INVESTMENTS", subs: ["Retirement Account","Investment","Emergency Fund","Other Savings"] },
                { main: "PENGHASILAN UTAMA", subs: ["Gaji Pokok","Tunjangan","Bonus/Komisi","THR/Gaji ke-13"] },
                { main: "PENGHASILAN SAMPINGAN", subs: ["Freelance / Kontrak","Bisnis Sampingan","Hasil Penjualan Aset","Other Sampingan"] },
                { main: "PENGHASILAN PASIF & LAINNYA", subs: ["Dividen / Bunga Investasi","Bunga Tabungan / Deposito","Hasil Sewa Properti","Hadiah / Warisan","Pengembalian Utang"] }
            ]
        };

        const subToMain = { outcome: new Map(), income: new Map() };
        mapping.outcome.forEach(item => item.subs.forEach(sub => subToMain.outcome.set(sub, item.main)));
        mapping.income.forEach(item => item.subs.forEach(sub => subToMain.income.set(sub, item.main)));
        const allSubs = { outcome: Array.from(subToMain.outcome.keys()), income: Array.from(subToMain.income.keys()) };

        // ----- DOM -----
        const dateInput              = document.getElementById('dateInput');
        const timeInput              = document.getElementById('timeInput');
        const incomeOutcome          = document.getElementById('incomeOutcome');
        const subCategoryHidden      = document.getElementById('subCategory');
        const mainCategoryInput      = document.getElementById('mainCategory');
        const nominalInput           = document.getElementById('nominal');
        const descInput              = document.getElementById('desc');
        const form                   = document.getElementById('ledgerForm');
        const infoSpan               = document.getElementById('infoText');
        const submitBtn              = document.getElementById('submitBtn');
        const categoryWarning        = document.getElementById('categoryWarning');
        const refreshBtn             = document.getElementById('refreshBtn');
        const dropdownToggle         = document.getElementById('dropdownToggle');
        const dropdownMenu           = document.getElementById('dropdownMenu');
        const subSearch              = document.getElementById('subSearch');
        const dropdownItemsContainer = document.getElementById('dropdownItemsContainer');
        const selectedSubLabel       = document.getElementById('selectedSubLabel');
        const pillAlfari             = document.getElementById('pillAlfari');
        const pillNenis              = document.getElementById('pillNenis');
        const userWarning            = document.getElementById('userWarning');

        let rawNominalValue = '';
        let selectedUser    = ''; // 'Alfari' | 'Nenis' | ''

        // ----- User pill logic -----
        function setUser(user) {
            selectedUser = user;
            pillAlfari.classList.remove('active-alfari');
            pillNenis.classList.remove('active-nenis');
            userWarning.classList.add('hidden');

            if (user === 'Alfari') {
                pillAlfari.classList.add('active-alfari');
                infoSpan.innerText = '👤 Alfari dipilih — data dikirim ke sheet Alfari.';
            } else if (user === 'Nenis') {
                pillNenis.classList.add('active-nenis');
                infoSpan.innerText = '👤 Nenis dipilih — data dikirim ke sheet Nenis.';
            }
        }

        pillAlfari.addEventListener('click', () => setUser('Alfari'));
        pillNenis.addEventListener('click',  () => setUser('Nenis'));

        // ----- Refresh -----
        refreshBtn.addEventListener('click', () => window.location.reload());

        // ----- Defaults -----
        function setDefaults() {
            const today = new Date();
            const year  = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day   = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;
            const hours   = String(today.getHours()).padStart(2, '0');
            const minutes = String(today.getMinutes()).padStart(2, '0');
            timeInput.value = `${hours}:${minutes}`;
        }
        setDefaults();

        // ----- Nominal formatting -----
        function formatNumber(number) {
            if (!number) return '';
            const cleanNumber  = number.toString().replace(/[^\d-]/g, '');
            const isNegative   = cleanNumber.startsWith('-');
            const absoluteNum  = isNegative ? cleanNumber.substring(1) : cleanNumber;
            const formatted    = absoluteNum.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return isNegative ? `-${formatted}` : formatted;
        }

        function parseFormattedNumber(val) {
            return val ? val.replace(/\./g, '') : '';
        }

        function handleNominalInput(e) {
            let input      = e.target;
            let cursorPos  = input.selectionStart;
            let rawValue   = input.value;
            let digitsOnly = rawValue.replace(/[^\d-]/g, '');
            let minusCount = (digitsOnly.match(/-/g) || []).length;
            if (minusCount > 1) { digitsOnly = digitsOnly.replace(/-/g, ''); }
            else if (minusCount === 1 && !digitsOnly.startsWith('-')) { digitsOnly = digitsOnly.replace(/-/g, ''); }
            rawNominalValue = digitsOnly;
            let formattedValue = formatNumber(digitsOnly);
            if (formattedValue !== input.value) {
                input.value = formattedValue;
                let newCursorPos = cursorPos;
                if (rawValue.length < formattedValue.length) { newCursorPos += formattedValue.length - rawValue.length; }
                input.setSelectionRange(newCursorPos, newCursorPos);
            }
        }

        nominalInput.addEventListener('input', handleNominalInput);
        nominalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' || e.key === 'Delete') {
                let input = e.target;
                let cursorPos = input.selectionStart;
                setTimeout(() => {
                    handleNominalInput({ target: input });
                    input.setSelectionRange(cursorPos - 1, cursorPos - 1);
                }, 0);
            }
        });
        nominalInput.addEventListener('paste', (e) => {
            e.preventDefault();
            let pastedText  = (e.clipboardData || window.clipboardData).getData('text');
            let digitsOnly  = pastedText.replace(/[^\d-]/g, '');
            rawNominalValue = digitsOnly;
            nominalInput.value = formatNumber(digitsOnly);
        });
        nominalInput.addEventListener('blur', () => {
            if (nominalInput.value) {
                let digitsOnly = parseFormattedNumber(nominalInput.value);
                if (digitsOnly) nominalInput.value = formatNumber(digitsOnly);
            }
        });
        nominalInput.addEventListener('focus', () => {
            if (rawNominalValue) nominalInput.value = rawNominalValue;
        });

        // ----- Dropdown -----
        function renderDropdownItems(filterText = '') {
            const type = incomeOutcome.value;
            if (!type) {
                dropdownItemsContainer.innerHTML = '<div style="padding:1rem 1.5rem; color:#777;">Please select Income/Outcome first</div>';
                return;
            }
            const typeKey    = type === 'Pemasukan' ? 'income' : 'outcome';
            const subs       = allSubs[typeKey];
            const filterLow  = filterText.toLowerCase().trim();
            let filtered     = filterLow ? subs.filter(s => s.toLowerCase().includes(filterLow)) : subs;
            let htmlStr      = '';
            filtered.forEach(sub => {
                const sel = (subCategoryHidden.value === sub) ? ' selected' : '';
                htmlStr += `<div class="dropdown-item${sel}" data-sub="${sub}">${sub}</div>`;
            });
            if (!filtered.length) htmlStr = '<div style="padding:1rem 1.5rem; color:#777;">no matching sub category</div>';
            dropdownItemsContainer.innerHTML = htmlStr;
        }

        function handleTypeChange() {
            subCategoryHidden.value = '';
            selectedSubLabel.innerText = incomeOutcome.value ? 'Choose sub category' : 'First select Income/Outcome';
            mainCategoryInput.value = '';
            categoryWarning.classList.add('hidden');
            renderDropdownItems();
            closeDropdown();
            if (incomeOutcome.value) {
                infoSpan.innerText = incomeOutcome.value === 'Pemasukan' ? '💰 Income mode: Showing income categories' : '💸 Outcome mode: Showing expense categories';
            }
        }

        incomeOutcome.addEventListener('change', handleTypeChange);

        function closeDropdown() { dropdownMenu.classList.remove('show'); }
        function openDropdown() {
            if (!incomeOutcome.value) {
                categoryWarning.textContent = 'Please select Income/Outcome first';
                categoryWarning.classList.remove('hidden');
                return;
            }
            categoryWarning.classList.add('hidden');
            subSearch.value = '';
            renderDropdownItems();
            dropdownMenu.classList.add('show');
            subSearch.focus();
        }

        dropdownToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.contains('show') ? closeDropdown() : openDropdown();
        });

        subSearch.addEventListener('input', (e) => renderDropdownItems(e.target.value));

        dropdownItemsContainer.addEventListener('click', (e) => {
            const item = e.target.closest('.dropdown-item');
            if (!item) return;
            const selectedSub = item.dataset.sub;
            if (!selectedSub) return;
            const type    = incomeOutcome.value;
            if (!type) { categoryWarning.textContent = 'Please select Income/Outcome first'; categoryWarning.classList.remove('hidden'); return; }
            const typeKey = type === 'Pemasukan' ? 'income' : 'outcome';
            if (!subToMain[typeKey].has(selectedSub)) { categoryWarning.textContent = 'Invalid category for selected type'; categoryWarning.classList.remove('hidden'); return; }
            subCategoryHidden.value = selectedSub;
            selectedSubLabel.textContent = selectedSub;
            mainCategoryInput.value = subToMain[typeKey].get(selectedSub) || '';
            closeDropdown();
            renderDropdownItems(subSearch.value);
            categoryWarning.classList.add('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!dropdownToggle.contains(e.target) && !dropdownMenu.contains(e.target)) closeDropdown();
        });
        dropdownMenu.addEventListener('click', (e) => e.stopPropagation());

        // ----- Submit -----
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate user
            if (!selectedUser) {
                userWarning.classList.remove('hidden');
                infoSpan.innerText = '❌ Pilih user (Alfari / Nenis) terlebih dahulu.';
                return;
            }

            if (!incomeOutcome.value) { infoSpan.innerText = '❌ Please select Income or Outcome.'; return; }
            if (!subCategoryHidden.value) { infoSpan.innerText = '❌ Please select a sub category.'; return; }

            const rawNominal = parseFormattedNumber(nominalInput.value);
            if (!rawNominal || parseFloat(rawNominal) < 0) { infoSpan.innerText = '❌ Nominal must be a positive number.'; return; }

            const typeKey = incomeOutcome.value === 'Pemasukan' ? 'income' : 'outcome';
            if (!subToMain[typeKey].has(subCategoryHidden.value)) { infoSpan.innerText = '❌ Selected category does not match Income/Outcome type.'; return; }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            const payload = {
                date: dateInput.value,
                time: timeInput.value,
                incomeOutcome: incomeOutcome.value,
                mainCategory: mainCategoryInput.value,
                subCategory: subCategoryHidden.value,
                nominal: rawNominal,
                desc: descInput.value || '',
                user: selectedUser
            };

            // Choose target URL based on selected user
            const targetURL = selectedUser === 'Nenis' ? GSHEET_URL_NENIS : GSHEET_URL;

            infoSpan.innerHTML = `⏳ Mengirim ke sheet <strong>${selectedUser}</strong>...`;

            try {
                await fetch(targetURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                infoSpan.innerHTML = `✅ Entry terkirim ke sheet <strong>${selectedUser}</strong>. Form siap diisi lagi.`;

                setDefaults();
                subCategoryHidden.value = '';
                selectedSubLabel.innerText = 'Choose sub category';
                mainCategoryInput.value = '';
                nominalInput.value = '';
                rawNominalValue = '';
                descInput.value = '';
                renderDropdownItems();

            } catch (error) {
                console.error(error);
                infoSpan.innerHTML = '⚠️ Error submitting. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Send to gsheet';
            }
        });

        renderDropdownItems();
        infoSpan.innerText = '✔️ Default today/now set. Pilih user & Income/Outcome terlebih dahulu.';
    })();
</script>
</body>
</html>
